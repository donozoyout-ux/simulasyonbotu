services:
  - type: web
    name: bist-simulator-api
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bist-simulator-db
          property: connectionString
      - key: DATA_MODE
        value: live
      - key: MARKET_DATA_PROVIDER
        value: hybrid
      - key: OPERATION_MODE
        value: LIVE_PAPER
      - key: LIVE_STRATEGY_VERSION
        value: V3_FROZEN_1
      - key: AUTO_SCAN_ENABLED
        value: "false"
      - key: EMBEDDED_WORKER_ENABLED
        value: "true"
      - key: MARKET_OPEN_POLL_SECONDS
        value: "300"
      - key: AFTER_HOURS_POLL_SECONDS
        value: "900"
      - key: OFF_HOURS_SCAN_ENABLED
        value: "true"
      - key: OFF_HOURS_SCAN_INTERVAL_MINUTES
        value: "30"
      - key: OFF_HOURS_SCAN_SYMBOL_LIMIT
        value: "30"
      - key: SYMBOL_QUARANTINE_FAILURE_THRESHOLD
        value: "3"
      - key: SYMBOL_QUARANTINE_MINUTES
        value: "60"
      - key: SCANNER_SYMBOL_LIMIT
        value: "30"
      - key: MANUAL_SCAN_SYMBOL_LIMIT
        value: "10"
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: AI_MIN_SCORE
        value: "70"
      - key: AI_TIMEOUT_SECONDS
        value: "25"
      - key: NEWS_ENABLED
        value: "true"
      - key: KAP_ENABLED
        value: "true"
      - key: NEWS_POLL_MINUTES_OPEN
        value: "5"
      - key: NEWS_POLL_MINUTES_CLOSED
        value: "15"
      - key: NEWS_TELEGRAM_MIN_IMPORTANCE
        value: "80"
      - key: NEWS_BACKFILL_DAYS
        value: "90"
      - key: BACKFILL_ENABLED
        value: "true"
      - key: BACKFILL_SYMBOLS_PER_CYCLE
        value: "2"
      - key: BACKFILL_CANDLE_LIMIT
        value: "1000"
      - key: MARKET_MEMORY_ENABLED
        value: "true"
      - key: MARKET_MEMORY_REACTION_BATCH
        value: "50"
      - key: CANDLE_RETENTION_ENABLED
        value: "false"
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_SIGNAL_ALERTS
        value: "true"
      - key: TELEGRAM_OFF_HOURS_ANALYSIS
        value: "false"
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: EODHD_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://bist-simulator-api.onrender.com,http://localhost:3000

databases:
  - name: bist-simulator-db
    databaseName: bist_simulator
    user: bist
    plan: free
