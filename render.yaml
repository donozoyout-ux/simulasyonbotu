services:
  - type: web
    name: bist-simulator-api
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bist-simulator-db
          property: connectionString
      - key: DATA_MODE
        value: live
      - key: MARKET_DATA_PROVIDER
        value: hybrid
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: EODHD_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://bist-simulator-api.onrender.com,http://localhost:3000

  - type: worker
    name: bist-simulator-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.forward_worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bist-simulator-db
          property: connectionString
      - key: DATA_MODE
        value: live
      - key: MARKET_DATA_PROVIDER
        value: hybrid
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: EODHD_API_TOKEN
        sync: false
      - key: WORKER_POLL_SECONDS
        value: "20"

databases:
  - name: bist-simulator-db
    databaseName: bist_simulator
    user: bist
    plan: free
