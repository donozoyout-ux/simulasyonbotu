services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bist_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-bist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bist_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bist} -d ${POSTGRES_DB:-bist_simulator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bist}:${POSTGRES_PASSWORD:-bist_local_password}@db:5432/${POSTGRES_DB:-bist_simulator}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      DATA_MODE: ${DATA_MODE:-live}
      ALLOW_MOCK_FALLBACK: "false"
      OPERATION_MODE: LIVE_PAPER
      LIVE_STRATEGY_VERSION: V3_FROZEN_1
      AUTO_SCAN_ENABLED: "false"
      AI_ENABLED: "true"
      AI_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: openai/gpt-oss-20b
      AI_MIN_SCORE: "70"
      AI_TIMEOUT_SECONDS: "25"
      NEWS_ENABLED: ${NEWS_ENABLED:-true}
      KAP_ENABLED: ${KAP_ENABLED:-true}
      NEWS_POLL_MINUTES_OPEN: ${NEWS_POLL_MINUTES_OPEN:-5}
      NEWS_POLL_MINUTES_CLOSED: ${NEWS_POLL_MINUTES_CLOSED:-15}
      NEWS_TELEGRAM_MIN_IMPORTANCE: ${NEWS_TELEGRAM_MIN_IMPORTANCE:-80}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m scripts.forward_worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bist}:${POSTGRES_PASSWORD:-bist_local_password}@db:5432/${POSTGRES_DB:-bist_simulator}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      DATA_MODE: ${DATA_MODE:-live}
      ALLOW_MOCK_FALLBACK: "false"
      OPERATION_MODE: LIVE_PAPER
      LIVE_STRATEGY_VERSION: V3_FROZEN_1
      AUTO_SCAN_ENABLED: "false"
      AI_ENABLED: "true"
      AI_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: openai/gpt-oss-20b
      AI_MIN_SCORE: "70"
      AI_TIMEOUT_SECONDS: "25"
      NEWS_ENABLED: ${NEWS_ENABLED:-true}
      KAP_ENABLED: ${KAP_ENABLED:-true}
      NEWS_POLL_MINUTES_OPEN: ${NEWS_POLL_MINUTES_OPEN:-5}
      NEWS_POLL_MINUTES_CLOSED: ${NEWS_POLL_MINUTES_CLOSED:-15}
      NEWS_TELEGRAM_MIN_IMPORTANCE: ${NEWS_TELEGRAM_MIN_IMPORTANCE:-80}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WORKER_POLL_SECONDS: "20"
    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data:
