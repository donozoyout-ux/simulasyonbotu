name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Wake BIST simulator
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bist-simulator-api.onrender.com/api/health"

          echo "Pinging $URL"

          for attempt in 1 2 3; do
            status="$(curl               --silent               --show-error               --location               --max-time 60               --connect-timeout 15               --output /tmp/health.json               --write-out "%{http_code}"               "$URL" || true)"

            echo "Attempt $attempt -> HTTP $status"

            if [ "$status" = "200" ]; then
              echo "Render service is awake."
              cat /tmp/health.json
              exit 0
            fi

            sleep 10
          done

          echo "Render service did not return HTTP 200."
          test -f /tmp/health.json && cat /tmp/health.json || true
          exit 1
